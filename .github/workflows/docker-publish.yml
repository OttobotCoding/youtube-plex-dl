name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".env*.example"
      - "unraid-template.xml"
      - "scripts/**"
  # Weekly rebuild. yt-dlp is unpinned in requirements.txt, so this is what
  # keeps YouTube extraction working without you touching anything.
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # GHCR requires an all-lowercase image name; repo names often aren't.
      - name: Normalise image name
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=youtube-plex-dl
            org.opencontainers.image.description=YouTube downloader with a Plex-friendly TV Shows layout

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Unraid is x86_64. Adding linux/arm64 roughly triples build time
          # because it runs under QEMU emulation — only add it if you need it.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Scheduled and manual runs skip the layer cache on purpose: a cached
          # pip layer would reinstall the SAME yt-dlp and defeat the whole point
          # of the weekly rebuild.
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "yt-dlp in this image: \`$(grep yt-dlp requirements.txt)\`"
            [ "${{ github.event_name }}" = "schedule" ] && echo "_Weekly no-cache rebuild._"
          } >> "$GITHUB_STEP_SUMMARY"

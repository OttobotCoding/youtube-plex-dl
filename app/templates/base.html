<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ config.APP_TITLE }}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script>
    // Prefer the vendored copy so the UI works without internet access;
    // fall back to a CDN if the image was built offline.
    (function () {
      var s = document.createElement('script');
      s.src = '/static/htmx.min.js';
      s.defer = true;
      s.onerror = function () {
        var f = document.createElement('script');
        f.src = 'https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js';
        f.defer = true;
        document.head.appendChild(f);
      };
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark">▶</span>
      <span>{{ config.APP_TITLE }}</span>
    </a>
    <nav class="nav">
      <a href="/">Download</a>
      <a href="/history">History</a>
      <span class="pill" title="Plex library root inside the container">{{ config.OUTPUT_DIR }}</span>
    </nav>
  </div>
</header>

<main class="wrap">
  {% block content %}{% endblock %}
</main>

<div id="toast-host" aria-live="polite"></div>

<footer class="wrap foot">
  <span>Season mode: <code>{{ config.SEASON_MODE }}</code></span>
  <span>Merge: <code>{{ config.MERGE_FORMAT }}</code></span>
  <span>Concurrency: <code>{{ config.CONCURRENCY }}</code></span>
  <span>Email: <code>{{ "on" if config.email_ready() else "off" }}</code></span>
</footer>

<script src="/static/app.js" defer></script>
</body>
</html>
